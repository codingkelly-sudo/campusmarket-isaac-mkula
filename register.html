<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CampusMarket</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Campus<span>Market</span></a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="catalog.html">Catalog</a></li>
          <li><a href="register.html" aria-current="page">Register</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="register-section" aria-labelledby="register-heading">
      <div class="container">
        <header class='register-header'>
          <h1 id="register-heading">Create Your Account</h1>
          <p class="register-subtitle">Sign up to access campusmarket's services.</p>
        </header>
<!--password-->
        <form id="registerForm" class="register-form" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" 
                  id="fullName"
                   name="fullName"
                   placeholder="John Doe"
                   required>
            <p class="error-message" id="fullNameError"></p>
          </div>
<!--email-->
          <div class="form-group">
            <label for="email">Campus Email</label>
            <input type="text" id="email" name="email" placeholder="you@university.edu">
            <p class="error-message" id="emailError"></p>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" 
                id="password"
                 name="password"
                 placeholder="create strong password"
                 autoComplete="new-password"
                 required>
              <button type="button" 
                id="togglePassword" 
                class="toggle-btn"
                aria-label="Show password">
                Show</button>
            </div>
            <p class="error-message" id="passwordError"></p>
          </div>
<!--confirm password-->
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password"
               id="confirmPassword" 
               name="confirmPassword"
               placeholder="reenter your password"
               autocomplete="new-password"
               required>
            <p class="error-message" id="confirmPasswordError"></p>
          </div>
<!--submit button-->
          <button type="submit" class="btn">Create Account</button>
          <p id="formSuccess" class="form-success" hidden>Account created successfully! Welcome to CampusMarket.
          </p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 CampusMarket. Built for students, by students.</p>
      <p>Questions? Reach us at <a href="mailto:hello@campusmarket.example">hello@campusmarket.example</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
